local_backend: true

backend:
  name: git-gateway
  repo: enigmalea/enigmalea.quest
  branch: main
media_folder: src/assets/img/uploads
public_folder: src/assets/img/uploads

collections:
  - name: "blog" # Used in routes, e.g., /admin/collections/blog
    label: "Blog" # Used in the UI
    folder: "src/pages/blog/posts" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    fields: # The fields for each document, usually in frontmatter
      - {
          label: "Draft",
          name: "draft",
          widget: "boolean",
          default: false,
          required: false,
        }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - {
          label: "Updated Date",
          name: "date",
          widget: "datetime",
          required: false,
        }
      - {
          label: "Featured Image",
          name: "image",
          widget: "image",
          required: false,
        }
      - { label: "Body", name: "body", widget: "richtext" }
      - { label: "Tags", name: "tags", widget: "string" }
      - {
          label: "Category",
          name: "category",
          widget: "select",
          options: ["Dragon Age", "Fandom", "Roleplay", "Tech"],
        }
